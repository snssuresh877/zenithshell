# ~/.config/hypr/hyprlock.conf
# ZenithShell Modern Glass Hyprlock Configuration

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgba(15, 15, 20, 0.95)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.89
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Big Time Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(248, 248, 242, 0.95)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(189, 147, 249, 0.90)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# User Greeting & Lock Badge
label {
    monitor =
    text = 󰌆  $USER
    color = rgba(166, 173, 200, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -20
    halign = center
    valign = center
}

# Password Input Field (PAM Authentication)
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(189, 147, 249, 0.35)
    inner_color = rgba(18, 19, 26, 0.90)
    font_color = rgb(248, 248, 242)
    
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>󰌆  Enter Password...</i>
    placeholder_text_color = rgba(166, 173, 200, 0.50)
    
    hide_input = false
    rounding = 14
    
    check_color = rgb(80, 250, 123)
    fail_color = rgb(255, 85, 85)
    fail_text = <i>Authentication Failed ($ATTEMPTS)</i>
    fail_transition = 200
    
    capslock_color = rgb(255, 184, 108)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -80
    halign = center
    valign = center
}

# Battery Status Indicator at bottom
label {
    monitor =
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)% 󰂂"
    color = rgba(98, 114, 164, 0.75)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = bottom
}

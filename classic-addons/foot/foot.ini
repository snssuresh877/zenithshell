# ============================================
# FOOT TERMINAL
# Arch Linux • Hyprland • 2026
# ============================================

[main]

term=foot

font=JetBrainsMono Nerd Font:size=10
font-bold=JetBrainsMono Nerd Font:style=Bold:size=10
font-italic=JetBrainsMono Nerd Font:style=Italic:size=10
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=10

dpi-aware=yes

pad=10x10 center

initial-window-size-chars=120x34

# Keep selection in primary buffer so browser clipboard (Ctrl+C) is never overwritten
selection-target=primary

shell=/usr/bin/fish
login-shell=yes

workers=0

resize-delay-ms=10

[cursor]

style=beam
blink=yes
beam-thickness=1.5

[scrollback]

lines=20000
multiplier=3

[mouse]

hide-when-typing=yes
alternate-scroll-mode=yes

[url]

launch=xdg-open ${url}

[key-bindings]

clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v Control+v Control+V XF86Paste
primary-paste=Shift+Insert

search-start=Control+Shift+r

font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[mouse-bindings]

primary-paste=BTN_MIDDLE

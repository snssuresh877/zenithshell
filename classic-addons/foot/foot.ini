# ============================================
# 🐾 FOOT TERMINAL • ZENITH SHELL OPTIMIZED
# Arch Linux • Hyprland • C++20 Ecosystem
# ============================================

[main]
term=foot

font=JetBrainsMono Nerd Font:size=10
font-bold=JetBrainsMono Nerd Font:style=Bold:size=10
font-italic=JetBrainsMono Nerd Font:style=Italic:size=10
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=10

dpi-aware=yes
pad=12x12 center
initial-window-size-chars=120x34

# Keep selection in primary buffer so browser clipboard (Ctrl+C) is never overwritten
selection-target=primary

shell=/usr/bin/fish
login-shell=yes

workers=0
resize-delay-ms=10

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[scrollback]
lines=25000
multiplier=3

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v Control+v Control+V XF86Paste
primary-paste=Shift+Insert

search-start=Control+Shift+r
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[mouse-bindings]
primary-paste=BTN_MIDDLE

# ---------- DEFAULT FALLBACK PALETTE (Zenith Obsidian) ----------
[colors-dark]
alpha=0.95
background=0e0f14
foreground=f2eeff

# Normal / Regular
regular0=161720
regular1=ff5c6c
regular2=3ddc84
regular3=ffb454
regular4=a875ff
regular5=c084fc
regular6=38bdf8
regular7=f2eeff

# Bright
bright0=262838
bright1=ff7584
bright2=52e698
bright3=ffc674
bright4=b98eff
bright5=d09eff
bright6=5cd0ff
bright7=ffffff



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#dropShadow)"/>

  <!-- Back Folder Tab -->
  <path d="M 26 38 L 48 38 L 56 46 L 98 46 C 102.4 46 106 49.6 106 54 L 106 86 C 106 90.4 102.4 94 98 94 L 30 94 C 25.6 94 22 90.4 22 86 L 22 42 C 22 39.8 23.8 38 26 38 Z" fill="url(#tabGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Sheet of Paper inside -->
  <rect x="32" y="44" width="64" height="40" rx="4" ry="4" fill="#f1f5f9" opacity="0.9"/>
  <line x1="42" y1="54" x2="68" y2="54" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="62" x2="86" y2="62" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="70" x2="76" y2="70" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Front Folder Body -->
  <path d="M 22 56 C 22 51.6 25.6 48 30 48 L 98 48 C 102.4 48 106 51.6 106 56 L 106 88 C 106 92.4 102.4 96 98 96 L 30 96 C 25.6 96 22 92.4 22 88 Z" fill="url(#frontGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

  <!-- Subtle Accent Pip (Amber / Zenith) -->
  <circle cx="94" cy="60" r="3.5" fill="#fb7333"/>
</svg>

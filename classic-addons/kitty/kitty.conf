# ======================================
# 🐱 KITTY TERMINAL • ZENITH SHELL OPTIMIZED
# High-Performance GPU Terminal
# ======================================

# ---------- FONT ----------
font_family              JetBrainsMono Nerd Font
bold_font                auto
italic_font              auto
bold_italic_font         auto
font_size                11.0

# ---------- TEXT RENDER ----------
disable_ligatures        cursor
text_composition_strategy platform
adjust_line_height       2
adjust_column_width      0

# ---------- CURSOR ----------
cursor_shape             beam
cursor_blink_interval    0.5
cursor_stop_blinking_after 15.0

# ---------- SCROLLBACK ----------
scrollback_lines         25000
scrollback_pager_history_size 64

# ---------- PERFORMANCE ----------
repaint_delay            8
input_delay              2
sync_to_monitor          yes

# ---------- WINDOW ----------
window_padding_width     10
confirm_os_window_close  0
remember_window_size     yes
initial_window_width     120c
initial_window_height    34c
background_opacity       0.95

# ---------- SELECTION (Do NOT overwrite system clipboard on select) ----------
copy_on_select           no
strip_trailing_spaces    smart

# ---------- MOUSE & BELL ----------
hide_window_decorations  yes
focus_follows_mouse      no
enable_audio_bell        no
visual_bell_duration     0

# ---------- URL ----------
detect_urls              yes
url_style                curly
open_url_with            default

# ---------- SHORTCUTS ----------
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map ctrl+v               paste_from_clipboard
map shift+insert         paste_from_selection

# ---------- DEFAULT FALLBACK PALETTE (Zenith Obsidian) ----------
background               #0e0f14
foreground               #f2eeff
cursor                   #a875ff
cursor_text_color        #0e0f14
selection_background     #262838
selection_foreground     #f2eeff

# Black
color0                   #161720
color8                   #262838
# Red
color1                   #ff5c6c
color9                   #ff7584
# Green
color2                   #3ddc84
color10                  #52e698
# Yellow
color3                   #ffb454
color11                  #ffc674
# Blue
color4                   #a875ff
color12                  #b98eff
# Magenta
color5                   #c084fc
color13                  #d09eff
# Cyan
color6                   #38bdf8
color14                  #5cd0ff
# White
color7                   #f2eeff
color15                  #ffffff

# ---------- THEME SYNC (Pywal) ----------
include ~/.cache/wal/colors-kitty.conf


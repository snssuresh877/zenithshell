name: ✨ Feature Request
description: Suggest a new feature or design enhancement for ZenithShell
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature, UI component, or D-Bus method you would like to see
    validations:
      required: true

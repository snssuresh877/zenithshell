name: 🐛 Bug Report
description: Report a reproducible bug or crash in ZenithShell
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: system
    attributes:
      label: System Information
      description: Linux Distribution, Hyprland version, GPU/Hardware
      placeholder: e.g. Arch Linux, Hyprland 0.44.0, Intel Iris Xe
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: 1. Launch ZenithShell... 2. Click on...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any terminal or /tmp/zenithshell.log output
      render: shell

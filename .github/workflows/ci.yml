name: Build & Test ZenithShell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libgtk-3-dev \
          libgtk-layer-shell-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libglib2.0-dev \
          nlohmann-json3-dev

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Compile ZenithShell
      run: ninja -C build

    - name: Verify Binary Output
      run: |
        test -x build/zenithshell
        ls -lh build/zenithshell
